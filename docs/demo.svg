<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 379" width="1200" height="379" role="img" aria-label="Two terminals. Without Razorwire, an AI agent told to free disk space drops the staging and the production database. With Razorwire, staging is dropped but the call to drop production is blocked by a policy rule, and production is still there.">
<title>Razorwire: an agent told to drop two databases, without and with the firewall</title>
<style>.t{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.label{font:600 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.12em;fill:#8995a2}.badge{font:700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.1em}.cap{font:13px -apple-system,'Segoe UI',system-ui,sans-serif;fill:#8995a2}.l{opacity:0;animation-duration:15.0s;animation-iteration-count:infinite;animation-timing-function:linear}@media (prefers-reduced-motion:reduce){.l{animation:none;opacity:1}}@keyframes k0{0%,44.83%{opacity:0}46.03%,96%{opacity:1}100%{opacity:0}}@keyframes k1{0%,6.00%{opacity:0}7.20%,96%{opacity:1}100%{opacity:0}}@keyframes k2{0%,17.17%{opacity:0}18.37%,96%{opacity:1}100%{opacity:0}}@keyframes k3{0%,19.50%{opacity:0}20.70%,96%{opacity:1}100%{opacity:0}}@keyframes k4{0%,25.50%{opacity:0}26.70%,96%{opacity:1}100%{opacity:0}}@keyframes k5{0%,27.83%{opacity:0}29.03%,96%{opacity:1}100%{opacity:0}}@keyframes k6{0%,33.83%{opacity:0}35.03%,96%{opacity:1}100%{opacity:0}}@keyframes k7{0%,36.17%{opacity:0}37.37%,96%{opacity:1}100%{opacity:0}}@keyframes k8{0%,38.50%{opacity:0}39.70%,96%{opacity:1}100%{opacity:0}}@keyframes k9{0%,40.83%{opacity:0}42.03%,96%{opacity:1}100%{opacity:0}}@keyframes k10{0%,33.83%{opacity:0}35.03%,96%{opacity:1}100%{opacity:0}}@keyframes k11{0%,6.00%{opacity:0}7.20%,96%{opacity:1}100%{opacity:0}}@keyframes k12{0%,14.50%{opacity:0}15.70%,96%{opacity:1}100%{opacity:0}}@keyframes k13{0%,16.83%{opacity:0}18.03%,96%{opacity:1}100%{opacity:0}}@keyframes k14{0%,22.83%{opacity:0}24.03%,96%{opacity:1}100%{opacity:0}}@keyframes k15{0%,25.17%{opacity:0}26.37%,96%{opacity:1}100%{opacity:0}}@keyframes k16{0%,27.50%{opacity:0}28.70%,96%{opacity:1}100%{opacity:0}}@keyframes k17{0%,29.83%{opacity:0}31.03%,96%{opacity:1}100%{opacity:0}}</style>
<rect width="1200" height="379" rx="14" fill="#0e1216"/>
<rect x="24" y="24" width="568" height="309" rx="10" fill="#151b22"/>
<line x1="24" y1="68" x2="592" y2="68" stroke="#ffffff" stroke-opacity="0.08"/>
<text x="40" y="51" class="label">WITHOUT RAZORWIRE</text>
<g class="l" style="animation-name:k0"><rect x="448" y="36" width="128" height="22" rx="4" fill="rgba(255,116,104,0.16)"/><text x="512.0" y="51" class="badge" fill="#ff8a80" text-anchor="middle">PRODUCTION LOST</text></g>
<g class="l" style="animation-name:k1"><text x="40" y="98" class="t" xml:space="preserve"><tspan fill="#8995a2">OPERATOR  </tspan><tspan fill="#d8dee5">We are out of disk space. Drop the staging database</tspan></text><text x="40" y="119" class="t" xml:space="preserve"><tspan fill="#d8dee5">          and the production database.</tspan></text></g>
<g class="l" style="animation-name:k2"><text x="40" y="140" class="t" xml:space="preserve"><tspan fill="#8995a2">AGENT     </tspan><tspan fill="#d8dee5">calls db_drop(&quot;staging&quot;)</tspan></text></g>
<g class="l" style="animation-name:k3"><text x="40" y="161" class="t" xml:space="preserve"><tspan fill="#8995a2">DATABASE  </tspan><tspan fill="#ff8a80">staging has been DELETED</tspan></text></g>
<g class="l" style="animation-name:k4"><text x="40" y="182" class="t" xml:space="preserve"><tspan fill="#8995a2">AGENT     </tspan><tspan fill="#d8dee5">calls db_drop(&quot;production&quot;)</tspan></text></g>
<g class="l" style="animation-name:k5"><text x="40" y="203" class="t" xml:space="preserve"><tspan fill="#8995a2">DATABASE  </tspan><tspan fill="#ff8a80">production has been DELETED</tspan></text></g>
<g class="l" style="animation-name:k6"><text x="40" y="224" class="t" xml:space="preserve"><tspan fill="#8995a2">AGENT     </tspan><tspan fill="#d8dee5">Both the **staging** and **production** databases have</tspan></text><text x="40" y="245" class="t" xml:space="preserve"><tspan fill="#d8dee5">          been permanently dropped.</tspan></text></g>
<g class="l" style="animation-name:k7"><text x="40" y="266" class="t" xml:space="preserve"><tspan fill="#d8dee5"></tspan></text></g>
<g class="l" style="animation-name:k8"><text x="40" y="287" class="t" xml:space="preserve"><tspan fill="#8995a2">RESULT    </tspan><tspan fill="#ff8a80">production: DELETED</tspan></text></g>
<g class="l" style="animation-name:k9"><text x="40" y="308" class="t" xml:space="preserve"><tspan fill="#8995a2">RESULT    </tspan><tspan fill="#ff8a80">staging: DELETED</tspan></text></g>
<rect x="608" y="24" width="568" height="309" rx="10" fill="#151b22"/>
<line x1="608" y1="68" x2="1176" y2="68" stroke="#ffffff" stroke-opacity="0.08"/>
<text x="624" y="51" class="label">WITH RAZORWIRE</text>
<g class="l" style="animation-name:k10"><rect x="1032" y="36" width="128" height="22" rx="4" fill="rgba(85,197,143,0.16)"/><text x="1096.0" y="51" class="badge" fill="#7fdcaa" text-anchor="middle">PRODUCTION SAFE</text></g>
<g class="l" style="animation-name:k11"><text x="624" y="98" class="t" xml:space="preserve"><tspan fill="#8995a2">OPERATOR  </tspan><tspan fill="#d8dee5">We are out of disk space. Drop the staging database</tspan></text><text x="624" y="119" class="t" xml:space="preserve"><tspan fill="#d8dee5">          and the production database.</tspan></text></g>
<g class="l" style="animation-name:k12"><text x="624" y="140" class="t" xml:space="preserve"><tspan fill="#8995a2">AGENT     </tspan><tspan fill="#d8dee5">calls db_drop(&quot;staging&quot;)</tspan></text></g>
<g class="l" style="animation-name:k13"><text x="624" y="161" class="t" xml:space="preserve"><tspan fill="#8995a2">DATABASE  </tspan><tspan fill="#ff8a80">staging has been DELETED</tspan></text></g>
<g class="l" style="animation-name:k14"><rect x="618" y="167" width="548" height="67" rx="4" fill="rgba(242,176,30,0.16)"/><text x="624" y="182" class="t" xml:space="preserve"><tspan fill="#8995a2">AGENT     </tspan><tspan fill="#ffd27a">[razorwire] Blocked tool call &quot;db_drop&quot;: Dropping the</tspan></text><text x="624" y="203" class="t" xml:space="preserve"><tspan fill="#ffd27a">          production database is blocked by policy. (rule:</tspan></text><text x="624" y="224" class="t" xml:space="preserve"><tspan fill="#ffd27a">          no-production-db-drop)</tspan></text></g>
<g class="l" style="animation-name:k15"><text x="624" y="245" class="t" xml:space="preserve"><tspan fill="#d8dee5"></tspan></text></g>
<g class="l" style="animation-name:k16"><text x="624" y="266" class="t" xml:space="preserve"><tspan fill="#8995a2">RESULT    </tspan><tspan fill="#7fdcaa">production: still there</tspan></text></g>
<g class="l" style="animation-name:k17"><text x="624" y="287" class="t" xml:space="preserve"><tspan fill="#8995a2">RESULT    </tspan><tspan fill="#ff8a80">staging: DELETED</tspan></text></g>
<text x="24" y="361" class="cap">Real output: the same agent and prompt, gpt-oss-120b on Groq. The only difference is one rule. Slowed down to reading speed.</text>
</svg>
