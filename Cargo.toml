[package]
name = "razorwire"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "A proxy that sits between an AI agent and its model provider, records every tool call, and blocks the ones a policy forbids."
repository = "https://github.com/razorwire-dev/razorwire"
homepage = "https://razorwire.vercel.app"
readme = "README.md"
keywords = ["ai-agents", "llm", "proxy", "security", "guardrails"]
categories = ["command-line-utilities", "network-programming", "web-programming::http-server"]
# What goes into the crates.io package: the code, the example policy and
# executor, and the documents. The site, the Python SDK and CI stay out.
include = ["/src", "/examples", "/policy", "/README.md", "/LICENSE", "/SECURITY.md"]

[dependencies]
axum = "0.8"
cel = { version = "0.16", default-features = false, features = ["regex"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.4.3"
hmac = "0.13.0"
reqwest = { version = "0.12", features = ["stream"] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "2", default-features = false, features = ["deserialize"] }
serde_json = "1"
sha2 = "0.11.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs", "io-util", "sync", "time"] }
# Already used by reqwest for https to the provider; this serves https too.
tokio-native-tls = "0.3"

[features]
# Builds OpenSSL from source and links it in, so the Linux release binary
# runs on any distribution. Release builds only; it needs a C compiler.
vendored-openssl = ["tokio-native-tls/vendored"]

[profile.release]
strip = true
lto = "thin"
