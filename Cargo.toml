[package]
name = "razorwire"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A proxy that sits between an AI agent and its model provider, records every tool call, and blocks the ones a policy forbids."

[dependencies]
axum = "0.8"
cel = { version = "0.16", default-features = false, features = ["regex"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.12", features = ["stream"] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "2", default-features = false, features = ["deserialize"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs", "io-util", "sync"] }
