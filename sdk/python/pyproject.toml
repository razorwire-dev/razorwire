[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "razorwire"
version = "0.1.0"
description = "Python SDK for Razorwire, the action firewall for AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Razorwire" }]
keywords = ["ai", "agents", "llm", "security", "guardrails", "openai", "firewall"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Typing :: Typed",
]
# The SDK itself needs nothing beyond the standard library. `openai` is only
# imported by openai_client() and async_openai_client().
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.40"]
test = ["pytest>=8", "openai>=1.40"]

[project.urls]
Repository = "https://github.com/razorwire-dev/razorwire"

[tool.hatch.build.targets.wheel]
packages = ["src/razorwire"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
